name: wikipedia-through-time

services:
  mariadb:
    image: mariadb:lts

    # Come back by itself after a crash or a restart of the machine.
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: wtt
      MARIADB_USER: wtt
      MARIADB_PASSWORD: wtt
      MARIADB_ROOT_PASSWORD: wtt

    command:
      # Wikipedia's edit times are UTC, and they become the system time.
      - --default-time-zone=+00:00

      # Bulk loading 12 GB of article history wants a large redo log, and
      # losing the last second of a reloadable dataset is an easy trade.
      # The pool and the vector cache below are sized for a VM with 8 GB:
      # with a 3 GB pool and a 2 GB cache, a few heavy queries on top took
      # the server to 7.7 GB and the kernel killed it.
      - --innodb-buffer-pool-size=2G
      - --innodb-log-file-size=2G
      - --innodb-flush-log-at-trx-commit=2

      # One long article version can be megabytes, and a batch holds many.
      - --max-allowed-packet=512M

      # The default 16 MB cache holds only a sliver of the vector graphs. A
      # vector of 1,024 numbers takes about 2.5 KB in it with its neighbours,
      # so this holds the half million wordings the embedding job reaches.
      - --mhnsw-max-cache-size=1536M

    ports:
      # 3310 stays clear of a local MariaDB and of MariaDB's own demos.
      - "3310:3306"

    volumes:
      - mariadb:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

volumes:
  mariadb:
